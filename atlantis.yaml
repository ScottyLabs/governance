version: 3
parallel_plan: true
parallel_apply: true
projects:
  - name: keycloak
    dir: tofu/keycloak
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tf.json"
    apply_requirements: [mergeable, undiverged]
