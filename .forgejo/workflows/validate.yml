name: Validate

on:
  pull_request_target:

jobs:
  governance:
    name: Governance
    if: ${{ github.actor != 'scottylabs-bot' }}
    runs-on: native
    env:
      SECRETSPEC_PROFILE: ci
    enable-openid-connect: true
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: https://git.cmu.dev/ScottyLabs/kennel/.forgejo/actions/prepare@main

      - name: Validate
        run: devenv shell -- cargo run -q -p governance -- validate

      - name: Regenerate tofu, schemas, CODEOWNERS
        run: devenv shell -- ./.forgejo/scripts/regenerate.sh

      - name: Commit regenerated files if changed
        env:
          HEAD_CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_FULL: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_FULL: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ALLOW_EDIT: ${{ github.event.pull_request.allow_maintainer_edit }}
        run: devenv shell -- ./.forgejo/scripts/commit-regen.sh
